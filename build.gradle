plugins {
    id 'maven-publish'
    id 'java'
}

group = pluginGroup
version = pluginVersion

repositories {
    mavenCentral()
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    implementation 'org.spongepowered:spongeapi:7.1.0'
}
